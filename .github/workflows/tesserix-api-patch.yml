name: Tesserix broker patch

on:
  push:
    branches: [feat/civiclens-social-v2]
    paths:
      - internal/idp/providers/oauth/**
      - apps/api/Dockerfile.tesserix
      - .github/workflows/tesserix-api-patch.yml
  workflow_dispatch:

concurrency:
  group: tesserix-broker-patch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      ZITADEL_GOFIPS140: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify production base
        run: git merge-base --is-ancestor a618740b578627b7b9acbbb111a6948882d6f5dc HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify OAuth mapping
        run: |
          go test -race ./internal/idp/providers/oauth
          go vet ./internal/idp/providers/oauth
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build upstream API and console
        run: |
          export ZITADEL_VERSION="v4.19.5+tesserix.${GITHUB_SHA::7}"
          pnpm nx run @zitadel/api:pack-linux-amd64 --nxBail
          .artifacts/bin/linux/amd64/zitadel -v
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable broker patch
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: apps/api/Dockerfile.tesserix
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/tesserix/zitadel-api-patched:sha-${{ github.sha }}
      - name: Scan broker patch
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/tesserix/zitadel-api-patched:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
